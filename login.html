
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Swap Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #283593, #7986cb);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-container {
    background: white;
    width: 360px;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    text-align: center;
}

.login-container h1 {
    color: #283593;
    margin-bottom: 10px;
}

.login-container p {
    color: #777;
    margin-bottom: 25px;
}

.input-box {
    text-align: left;
    margin-bottom: 18px;
}

.input-box label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.input-box input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    outline: none;
}

.input-box input:focus {
    border-color: #3949ab;
}

.forgot {
    text-align: right;
    margin-bottom: 20px;
}

.forgot a {
    color: #3949ab;
    text-decoration: none;
    font-size: 14px;
}

.login-btn {
    width: 100%;
    padding: 13px;
    background: #3949ab;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    cursor: pointer;
}

.login-btn:hover {
    background: #1a237e;
}

.signup {
    margin-top: 20px;
    font-size: 14px;
}

.signup a {
    color: #3949ab;
    font-weight: bold;
    text-decoration: none;
}

.home {
    display: block;
    margin-top: 18px;
    color: #3949ab;
    text-decoration: none;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="login-container">

    <h1>SkillSwap</h1>
    <p>Welcome Back! Login to Continue</p>

    <form action="#" method="post">

        <div class="input-box">
            <label>Email Address</label>
            <input type="email"
            placeholder="Enter your email" required>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password"
            placeholder="Enter your password" required>
        </div>

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="signup">
        Don't have an account?
        <a href="file:///U:/Skill-Swap/registration.html">Sign Up</a>
    </div>

    <a href="index.html" class="home">
        ← Back to Home
    </a>

</div>

</body>
</html>
